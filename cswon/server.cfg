// ****************************************************************************
// Counter-Strike: WON2
// Config - server.cfg
// Date - 23/10/2026
// ****************************************************************************

// .................................. Basic ................................. //

// hostname - Name of the server.
hostname "SERVERNAME"

// rcon_password - Remote console password.
rcon_password "ADMINPASSWORD"

// sv_password - Server password for private servers.
sv_password ""

// ................................. Security ................................ //

// sv_cheats - Allow cheat commands.
// Default: sv_cheats 0
sv_cheats 0

// ............................. Server Logging ............................. //

// log - Enable server log output.
// Recommended: log on
log on

// sv_logbans - Log server bans in the server logs.
sv_logbans 1

// sv_logecho - Display log information in server console.
sv_logecho 1

// sv_logfile - Write server log information to file.
sv_logfile 1

// sv_log_onefile - Use a single rolling log file.
sv_log_onefile 0

// ................................ Gameplay ................................ //

// sv_aim - Enable autoaim assistance.
// Recommended: sv_aim 0
sv_aim 0

// pausable - Allow clients to pause the server.
// Recommended: pausable 0
pausable 0

// sv_maxspeed - Maximum client movement speed.
sv_maxspeed 320

// mp_timelimit - Round time limit in minutes.
mp_timelimit 20

// ............................. Counter-Strike ............................. //

// mp_friendlyfire - Allow team members to damage each other.
// Default: mp_friendlyfire 0
mp_friendlyfire 0

// mp_autoteambalance - Automatically balance the teams.
// Default: mp_autoteambalance 1
mp_autoteambalance 1

// mp_limitteams - Maximum player difference between the teams.
// Default: mp_limitteams 2
mp_limitteams 2

// mp_roundtime - Round time limit in minutes.
// Default: mp_roundtime 5
mp_roundtime 5

// mp_freezetime - Freeze time at the start of each round in seconds.
// Default: mp_freezetime 6
mp_freezetime 6

// mp_buytime - Buy time at the start of each round in minutes.
// Default: mp_buytime 1.5
mp_buytime 1.5

// mp_c4timer - C4 detonation timer in seconds.
// Default: mp_c4timer 45
mp_c4timer 45

// mp_startmoney - Starting money for new players.
// Default: mp_startmoney 800
mp_startmoney 800

// ................................ Ban List ................................ //

// exec listip.cfg - Load IP ban list.
exec listip.cfg

// exec banned.cfg - Load user ban list.
exec banned.cfg




