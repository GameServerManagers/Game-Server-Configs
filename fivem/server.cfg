# ****************************************************************************
# FiveM
# Config - server.cfg
# Date - 23/10/2026
# ****************************************************************************
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/
# The license key (sv_licenseKey) is set with licensekey in the LinuxGSM config.

# .................................. Network ................................ #

# Game port (TCP and UDP must match).
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# .................................. Resources .............................. #

# Base resources from https://github.com/citizenfx/cfx-server-data
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure rconlog

# .................................. Basic ................................. #

# Server name shown in the server list.
sv_hostname "SERVERNAME"

# Project name and description shown in the server list.
sets sv_projectName "SERVERNAME"
sets sv_projectDesc "A LinuxGSM FiveM server"

# Server list tags and locale.
sets tags "default"
sets locale "en-US"

# Max players. More than 48 needs OneSync.
sv_maxclients 48

# Hide the player list from the server list.
#sv_endpointprivacy true

# Do not list the server in the server list.
#sv_master1 ""

# Steam Web API key for Steam identifiers. "none" disables Steam authentication.
# https://steamcommunity.com/dev/apikey
set steam_webApiKey "none"

# .................................. Security .............................. #

# Uncomment and set a password to enable RCON.
#rcon_password ""

# Script hook (client mods) is not allowed by default.
sv_scriptHookAllowed 0

# .................................. Permissions ........................... #

add_ace group.admin command allow
add_ace group.admin command.quit deny
# Add a player to the admin group, e.g. with their Cfx.re account id.
#add_principal identifier.fivem:ACCOUNTID group.admin
